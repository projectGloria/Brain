[package]
name = "brain"
version = "0.3.0"
description = "Personal AI coding-agent rule compiler, multi-tool skill sync, and SHA-256 drift monitor"
authors = ["projectGloria"]
edition = "2021"

[[bin]]
name = "Brain"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
toml = "0.8"
dirs = "5"
