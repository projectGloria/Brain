<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="agent-brain banner">
  <defs>
    <radialGradient id="ambientGlow" cx="0%" cy="50%" r="48%" fx="0%" fy="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#FF6B00" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0" />
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="1199" height="319" rx="18" ry="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base dark card -->
    <rect x="0" y="0" width="1200" height="320" rx="18" ry="18" fill="#111216" />

    <!-- Left ambient glow -->
    <rect x="0" y="0" width="700" height="320" fill="url(#ambientGlow)" />

    <!-- Right geometric diagonal lines -->
    <line x1="930" y1="320" x2="1120" y2="0" stroke="#FF6B00" stroke-opacity="0.22" stroke-width="1.5" />
    <line x1="990" y1="320" x2="1180" y2="0" stroke="#FF6B00" stroke-opacity="0.22" stroke-width="1.5" />
    <line x1="1050" y1="320" x2="1240" y2="0" stroke="#FF6B00" stroke-opacity="0.22" stroke-width="1.5" />

    <!-- Left vertical accent bar -->
    <rect x="4" y="40" width="8" height="240" rx="4" ry="4" fill="#FF6B00" />
  </g>

  <!-- Card border -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" ry="18" fill="none" stroke="#262830" stroke-width="1" />

  <!-- Typography -->
  <text x="64" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FF6B00" letter-spacing="-0.5">agent-brain</text>
  <text x="64" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#D4D4D8">Personal coding-agent rule compiler, multi-tool skill sync &amp; SHA-256 drift checker</text>

  <!-- Feature Pills -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#E4E4E7">
    <!-- Pill 1 -->
    <rect x="64" y="220" width="212" height="42" rx="10" ry="10" fill="#181A20" stroke="#2C2F3A" stroke-width="1" />
    <circle cx="86" cy="241" r="5" fill="#FF6B00" />
    <text x="102" y="247">120-Line AGENTS.md</text>

    <!-- Pill 2 -->
    <rect x="292" y="220" width="196" height="42" rx="10" ry="10" fill="#181A20" stroke="#2C2F3A" stroke-width="1" />
    <circle cx="314" cy="241" r="5" fill="#FF6B00" />
    <text x="330" y="247">3-Tool Skill Sync</text>

    <!-- Pill 3 -->
    <rect x="504" y="220" width="216" height="42" rx="10" ry="10" fill="#181A20" stroke="#2C2F3A" stroke-width="1" />
    <circle cx="526" cy="241" r="5" fill="#FF6B00" />
    <text x="542" y="247">SHA-256 Drift Check</text>

    <!-- Pill 4 -->
    <rect x="736" y="220" width="168" height="42" rx="10" ry="10" fill="#181A20" stroke="#2C2F3A" stroke-width="1" />
    <circle cx="758" cy="241" r="5" fill="#FF6B00" />
    <text x="774" y="247">Zero Symlinks</text>
  </g>
</svg>
